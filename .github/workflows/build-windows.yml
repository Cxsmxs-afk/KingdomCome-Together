# One Windows build of this branch: native DLL, launcher, agent, relay,
# master, kdcmp.pak, the Inno Setup installer, and the drop-in zip.
# Players download the artifacts. They do not build.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/host-clock-bootstrap

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Relay unit tests
        run: dotnet test dotnet/KcdMp.Relay.Tests -c Release --logger "trx;LogFileName=relay.trx" --results-directory test-results

      - name: Client unit tests
        run: dotnet test dotnet/KcdMp.Client.Tests -c Release --logger "trx;LogFileName=client.trx" --results-directory test-results

      - name: Build installer, DLL, pak and programs
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools\Build-Installer.ps1
          -ReleaseCandidate
          -ArtifactBuild
          -SaveRoundTripWaiver "CI: no Modding Tools game on the runner"

      - name: Drop-in zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\Package-DropIn.ps1

      - name: Verify drop-in contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'release/KingdomComeTogether-DropIn.zip'))
          try {
            $entries = @{}
            foreach ($entry in $zip.Entries) { $entries[$entry.FullName.Replace('\', '/')] = $entry }
            foreach ($path in @('INSTALL.txt', 'KingdomComeTogether/KCDMP_launcher.exe', 'Mods/kdcmp/Data/kdcmp.pak', 'KingdomComeTogether/install-verify.txt')) {
              if (-not $entries.ContainsKey($path) -or $entries[$path].Length -eq 0) { throw "Missing or empty drop-in entry: $path" }
            }
            $reader = [System.IO.StreamReader]::new($entries['KingdomComeTogether/install-verify.txt'].Open())
            try { if ($reader.ReadLine() -notmatch '^PASS(?:\s|$)') { throw 'Drop-in install verification is not PASS' } }
            finally { $reader.Dispose() }
            Write-Output 'Drop-in contents PASS: instructions, launcher, pak and install-verify'
          }
          finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-come-together
          if-no-files-found: error
          path: |
            release/KingdomComeTogether-Setup-*.exe
            release/KingdomComeTogether-DropIn.zip
            release/BUILD-*.log
            release/RELEASE-CANDIDATE-*.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          if-no-files-found: warn
          path: test-results/*.trx

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Network simulator
        run: |
          chmod +x tools/sim/run-sim
          SIM_COMMIT="${GITHUB_SHA::7}" tools/sim/run-sim ci tools/sim/out --timeline both

      - uses: actions/upload-artifact@v4
        with:
          name: network-sim
          if-no-files-found: error
          path: |
            tools/sim/out/sim.json
            tools/sim/out/sim-load.json
            tools/sim/out/sim.md


