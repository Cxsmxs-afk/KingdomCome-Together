# One Windows build of this branch: native DLL, launcher, agent, relay,
# master, kdcmp.pak, the Inno Setup installer, and the drop-in zip.
# Players download the artifacts. They do not build.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
      - 'cursor/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y

      # Build-Installer runs the full managed, synthetic and native test gates.
      - name: Test and build installer, DLL, pak and programs
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools\Build-Installer.ps1
          -ReleaseCandidate
          -ArtifactBuild
          -SaveRoundTripWaiver "CI: no Modding Tools game on the runner"

      - name: Drop-in zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\Package-DropIn.ps1

      - name: Verify drop-in contents
        shell: pwsh
        # H21 removes the exact missing-saves expectation when the approved saves are packaged.
        run: >
          ./tools/Verify-DropIn.ps1
          -ZipPath release/KingdomComeTogether-DropIn.zip
          -Agent release/KCDMP/KcdMpClient.exe
          -ExpectMissingStartSaves

      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-come-together
          if-no-files-found: error
          path: |
            release/KingdomComeTogether-Setup-*.exe
            release/KingdomComeTogether-DropIn.zip
            release/BUILD-*.log
            release/RELEASE-CANDIDATE-*.txt

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Network simulator
        run: |
          chmod +x tools/sim/run-sim
          SIM_COMMIT="${GITHUB_SHA::7}" tools/sim/run-sim ci tools/sim/out --timeline both

      - name: End-to-End-Join
        shell: pwsh
        # H20 enables the required tests once the real reader integration fixture lands.
        run: ./tools/Test-JoinReadiness.ps1 -Check EndToEnd -ExpectKnownFailure

      - name: Join aborts preserve personal saves
        shell: pwsh
        # H19 removes the exact five-retained-slots expectation when pre-load cleanup is fixed.
        run: ./tools/Test-JoinReadiness.ps1 -Check Abort -ExpectKnownFailure

      - uses: actions/upload-artifact@v4
        with:
          name: network-sim
          if-no-files-found: error
          path: |
            tools/sim/out/sim.json
            tools/sim/out/sim-load.json
            tools/sim/out/sim.md


