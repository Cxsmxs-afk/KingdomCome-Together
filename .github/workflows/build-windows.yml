# One Windows build of this branch: native DLL, launcher, agent, relay,
# master, kdcmp.pak, the Inno Setup installer, and the drop-in zip.
# The verified drop-in ZIP is the download for players.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
      - 'cursor/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      zip-name: ${{ steps.package.outputs.zip-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y

      # Build-Installer runs the full managed, synthetic and native test gates.
      - name: Test and build installer, DLL, pak and programs
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools\Build-Installer.ps1
          -ReleaseCandidate
          -ArtifactBuild
          -SaveRoundTripWaiver "CI: no Modding Tools game on the runner"

      - name: Package and verify drop-in ZIP
        id: package
        shell: pwsh
        run: |
          $zip = & ./tools/Package-DropIn.ps1
          "zip-path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip-name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload the ZIP directly
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.zip-name }}
          path: ${{ steps.package.outputs.zip-path }}
          archive: false
          if-no-files-found: error
          overwrite: true

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Network simulator
        run: |
          chmod +x tools/sim/run-sim
          SIM_COMMIT="${GITHUB_SHA::7}" tools/sim/run-sim ci tools/sim/out --timeline both

  verify-download:
    needs: [build, sim]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify the run has exactly one download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
        run: |
          if (-not $env:ARTIFACT_ID -or -not $env:ARTIFACT_URL -or -not $env:ZIP_NAME) {
            throw 'Missing outputs from the drop-in upload'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=2"
          # Allow time for the uploaded artifact to appear in the REST API.
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            $result = Invoke-RestMethod -Uri $uri -Headers $headers
            if ($result.total_count -eq 1 -and $result.artifacts[0].id -eq $env:ARTIFACT_ID -and
                $result.artifacts[0].name -ceq $env:ZIP_NAME -and -not $result.artifacts[0].expired) {
              "Download [$env:ZIP_NAME]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
              Write-Host "Artifact count PASS: exactly one artifact ($env:ZIP_NAME)"
              exit 0
            }
            if ($attempt -lt 6) { Start-Sleep -Seconds 5 }
          }
          throw "Expected exactly one downloadable artifact ($env:ZIP_NAME, ID $env:ARTIFACT_ID); found $($result.total_count): $($result.artifacts.name -join ', ')"

